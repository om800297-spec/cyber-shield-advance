{% extends "base.html" %}{% block heading %}Jobs / Internship / Scholarship{% endblock %}{% block content %}
<div class="page-intro"><span class="eyebrow">03 • OPPORTUNITY SAFETY</span><h2>Spot fee demands, fake selection and guaranteed-job patterns.</h2></div>
<div class="panel tool-panel"><textarea id="txt" placeholder="Paste offer message... e.g. Congratulations! You are selected. Pay ₹2,000 registration fee."></textarea><button onclick="scanJobs()">SCAN OPPORTUNITY</button><div id="out"></div></div>
{% endblock %}{% block scripts %}<script>async function scanJobs(){let text=document.getElementById('txt').value;let r=await fetch('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,category:'Job / Internship / Scholarship'})}).then(x=>x.json());document.getElementById('out').innerHTML=resultHTML(r);window.lastScan={text,category:'Job / Internship / Scholarship',r}}</script>{% endblock %}<script>function resultHTML(r){return `<div class="big-result"><span class="risk ${r.level.replaceAll(' ','-').toLowerCase()}">${r.level}</span><b>${r.score}/100</b><p>${r.advice}</p><div class="chips">${r.indicators.map(x=>`<span>⚠ ${x}</span>`).join('')}</div></div>`}</script>
