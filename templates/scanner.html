{% extends "base.html" %}{% block heading %}Message Scanner{% endblock %}{% block content %}
<div class="scanner-layout"><div class="panel form-panel"><span class="eyebrow">01 • INPUT</span><h2>Analyze a suspicious message</h2><p class="muted">Paste SMS, WhatsApp, email or social-message text.</p>
<textarea id="text" placeholder="Example: Your KYC is pending. Verify now and pay the registration fee..."></textarea>
<div class="form-row"><select id="category"><option>Message</option><option>Bank / UPI</option><option>Job / Internship / Scholarship</option></select><button onclick="scan()">RUN RISK ANALYSIS →</button></div></div>
<div class="panel result-panel" id="result"><div class="empty">Your risk analysis will appear here.</div></div></div>
{% endblock %}{% block scripts %}<script>
async function scan(){let text=document.getElementById('text').value,category=document.getElementById('category').value;if(!text.trim())return alert('Enter a message first.');let r=await fetch('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,category})}).then(x=>x.json()); window.lastScan={text,category,r}; renderResult(r);}
function renderResult(r){document.getElementById('result').innerHTML=`<div class="result-top"><div><span class="eyebrow">RISK RESULT</span><h2>${r.level}</h2></div><div class="score">${r.score}<small>/100</small></div></div><div class="meter"><i style="width:${r.score}%"></i></div><h4>Suspicious Indicators</h4><div class="chips">${r.indicators.length?r.indicators.map(x=>`<span>⚠ ${x}</span>`).join(''):'<span class="good">✓ No strong indicators</span>'}</div><div class="advice"><b>Safety Advice</b><p>${r.advice}</p></div><h4>Detected Entities</h4><div class="entity-row"><span>📱 ${r.entities.mobile.length||0} mobile</span><span>✉️ ${r.entities.email.length||0} email</span><span>🔗 ${r.entities.urls.length||0} URL</span></div><button onclick="makeReport()">CREATE INCIDENT REPORT</button>`}
async function makeReport(){let r=window.lastScan;let out=await fetch('/api/report',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({category:r.category,message:r.text,risk:r.r,entities:r.r.entities})}).then(x=>x.json());location.href='/incident?rid='+out.id}
</script>{% endblock %}
