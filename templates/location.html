{% extends "base.html" %}{% block heading %}Sender Location Intelligence{% endblock %}{% block content %}
<div class="page-intro"><span class="eyebrow">07 • SHARED LOCATION</span><h2>Extract only location information explicitly shared inside a message.</h2></div>
<div class="panel tool-panel"><textarea id="t" placeholder="Paste a message containing an explicitly shared address, Google Maps link or coordinates..."></textarea><button onclick="locate()">DETECT SHARED LOCATION</button><div id="out"></div></div>
{% endblock %}{% block scripts %}<script>async function locate(){let t=document.getElementById('t').value;let r=await fetch('/api/location',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:t})}).then(x=>x.json());let map=r.coordinates.length?`<iframe class="map" src="https://www.google.com/maps?q=${r.coordinates[0][0]},${r.coordinates[0][1]}&output=embed"></iframe>`:'';document.getElementById('out').innerHTML=`<div class="big-result"><b>Detected coordinates:</b> ${JSON.stringify(r.coordinates)||'None'}<p><b>Location text:</b> ${r.location_text.join(', ')||'None'}</p><p>${r.message}</p>${map}</div>`}</script>{% endblock %}
