{% extends "base.html" %}{% block heading %}URL Scanner{% endblock %}{% block content %}
<div class="page-intro"><span class="eyebrow">04 • LINK INTELLIGENCE</span><h2>Inspect URLs for shortening, deceptive symbols and suspicious keywords.</h2></div>
<div class="panel tool-panel"><input id="url" placeholder="https://example.com/verify"><button onclick="scanURL()">SCAN URL</button><div id="out"></div></div>
{% endblock %}{% block scripts %}<script>async function scanURL(){let url=document.getElementById('url').value;let r=await fetch('/api/url',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url})}).then(x=>x.json());document.getElementById('out').innerHTML=`<div class="big-result"><span class="risk ${r.level.replaceAll(' ','-').toLowerCase()}">${r.level}</span><b>${r.score}/100</b><p><strong>Domain:</strong> ${r.host}</p><p>${r.advice}</p><div class="chips">${r.indicators.map(x=>`<span>⚠ ${x}</span>`).join('')||'<span class="good">✓ No pattern warnings</span>'}</div></div>`}</script>{% endblock %}
