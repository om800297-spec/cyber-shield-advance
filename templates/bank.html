{% extends "base.html" %}{% block heading %}Bank / UPI Scanner{% endblock %}{% block content %}
<div class="page-intro"><span class="eyebrow">02 • FINANCIAL SAFETY</span><h2>Detect payment-pressure and credential theft patterns.</h2></div>
<div class="panel tool-panel"><textarea id="txt" placeholder="Paste bank/UPI SMS... e.g. Your account will be blocked. Complete KYC and share OTP."></textarea><button onclick="scanBank()">SCAN BANK / UPI</button><div id="out"></div></div>
{% endblock %}{% block scripts %}<script>async function scanBank(){let text=document.getElementById('txt').value;let r=await fetch('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,category:'Bank / UPI'})}).then(x=>x.json());document.getElementById('out').innerHTML=resultHTML(r);window.lastScan={text,category:'Bank / UPI',r}}</script>{% endblock %}<script>function resultHTML(r){return `<div class="big-result"><span class="risk ${r.level.replaceAll(' ','-').toLowerCase()}">${r.level}</span><b>${r.score}/100</b><p>${r.advice}</p><div class="chips">${r.indicators.map(x=>`<span>⚠ ${x}</span>`).join('')}</div></div>`}</script>
